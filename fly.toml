# Rother - Fly.io deployment configuration
#
# Deploy instructions:
#   1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
#   2. Login: flyctl auth login
#   3. Create app: flyctl launch (or flyctl apps create rother)
#   4. Deploy: flyctl deploy
#
# The app will be available at: https://rother.fly.dev

app = "rother"

kill_signal = "SIGINT"
kill_timeout = 5

[deploy]
  release_command = "npm run build"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  GBP_MONITOR_NO_SANDBOX = "true"
  GBP_MONITOR_TIGHT_MEMORY = "true"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = 1
  internal_port = 3000
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[[mounts]]
  source = "rother_data"
  destination = "/app/gbp-monitor/data"