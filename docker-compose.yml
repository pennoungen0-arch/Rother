# Rother - Docker Compose for local development
#
# Usage:
#   docker compose up    # Start the full stack (dashboard + scraper)
#   docker compose down  # Stop everything

services:
  rother:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rother
    ports:
      - "3000:3000"
    volumes:
      - rother_data:/app/gbp-monitor/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  rother_data: