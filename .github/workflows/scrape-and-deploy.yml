name: scrape-and-deploy

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: ["0 2 * * 1"]
  workflow_dispatch:  # Allow manual triggering
  repository_dispatch:
    types: [scrape-triggered]

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The scraper needs Playwright + Chromium
    permissions:
      contents: write  # To commit data back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2 ca-certificates
          # Install Chromium for Playwright
          sudo apt-get install -y chromium-browser
          pip install playwright
          python -m playwright install chromium --no-shell

      - name: Install Python deps
        run: |
          pip install -r gbp-monitor/requirements.txt

      - name: Run scraper
        run: |
          cd gbp-monitor
          python -m orchestrator.run_all
        env:
          GBP_MONITOR_HEADLESS: "true"

      - name: Commit scraped data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Add all changed data files
          git add gbp-monitor/data/
          git add gbp-monitor/config/
          git diff --staged --quiet || git commit -m "chore: auto-update scraped data"
          git push
